# =============================================================================
# ERP ELEAM — Configuración de nginx para el contenedor de producción
# =============================================================================

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 25M;

    # Logs a stdout/stderr para que `docker compose logs` los muestre
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Archivos estáticos: servidos directamente por nginx
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Caché larga para assets compilados (Vite / Filament)
    location ~* \.(css|js|mjs|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP-FPM (escucha en localhost dentro del mismo contenedor)
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
