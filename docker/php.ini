; =============================================================================
; ERP ELEAM — Configuración de PHP para producción
; =============================================================================

[PHP]
; Oculta errores al visitante y los registra
display_errors = Off
log_errors = On

; Memoria y tamaño de subida (boletas/facturas adjuntas)
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M

; Zona horaria de Chile
date.timezone = America/Santiago

; Sesiones
session.cookie_httponly = On
session.use_strict_mode = On

[opcache]
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

[opcache.preload]
; Descomente si desea precargar el framework (requiere ajustar la ruta fpm):
; opcache.preload = /var/www/html/preload.php
; opcache.preload_user = www-data
